<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>BP Eventos - Portaria QR</title>
    <meta name="description" content="Sistema de check-in por QR Code para portaria de eventos" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#10b981" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BP Portaria" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS splash -->
    <meta name="apple-touch-startup-image" content="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%230f172a' width='100' height='100'/><text x='50' y='55' text-anchor='middle' fill='%2310b981' font-size='24' font-weight='bold' font-family='system-ui'>BP</text><text x='50' y='72' text-anchor='middle' fill='%2394a3b8' font-size='8' font-family='system-ui'>Portaria</text></svg>" />

    <!-- Prevent phone number auto-detection -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph -->
    <meta property="og:title" content="BP Eventos - Portaria QR" />
    <meta property="og:description" content="Check-in por QR Code para eventos" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
