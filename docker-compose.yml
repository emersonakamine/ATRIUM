services:
  baileys:
    image: devjuanda/baileys-server-pro:latest
    restart: always
    volumes:
      - baileys_data:/app/data

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - BAILEYS_SERVER_URL=http://baileys:3000
      - BAILEYS_SESSION=bp-eventos
    depends_on:
      - baileys

volumes:
  baileys_data:
